# Continuous integration: every push and pull request is tested automatically.
#   test       runs the whole pytest suite on Linux and Windows, on the oldest
#              and newest Python the project supports
#   benchmark  (only if the tests pass) times DP, greedy and graph cut on
#              castle.png and attaches the charts to the run as a download
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # also allows "Run workflow" by hand on the Actions tab

permissions:
  contents: read

concurrency:                # a newer push to the same branch cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false      # let the other combinations finish if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system libraries OpenCV needs (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  benchmark:
    name: timing charts
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries OpenCV needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Time DP, greedy and graph cut
        run: python -m seamcarving.benchmark castle.png --out benchmark-results

      - name: Show the timing tables on the run page
        run: cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
